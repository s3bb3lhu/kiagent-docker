name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan source for credentials
        run: python3 tools/scan_secrets.py
      - name: Verify version and localized documentation
        run: python3 -B tools/release_check.py
      - name: Validate release Compose files
        run: |
          docker compose -f compose.quickstart.yaml config --quiet
          docker compose -f compose.portable.yaml config --quiet
          docker compose -f compose.install.yaml config --quiet
      - name: Prepare test identity on disposable runner
        run: sudo useradd --system --user-group --no-create-home --shell /usr/sbin/nologin kiagent
      - name: Build and test without credentials or live bots
        run: sudo python3 tools/test_docker.py
      - name: Test portable first setup and restart without host access
        run: sudo python3 tools/test_portable.py
      - name: Check one-shot installer host namespace without installing services
        run: sudo docker compose -f compose.install.yaml run --rm --build -T installer --check
