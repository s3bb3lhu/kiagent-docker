{% extends 'dashboard_base.html' %}{% block content %}<p class="eyebrow">{{ t('live') }}</p><h1>{{ t('status') }} <span id="hostname" class="muted"></span></h1><p>{{ t('host_only') }}</p><div id="notice" class="notice" role="status">{{ t('loading') }}</div><p id="updated" class="fine"></p><div class="cards"><section class="card" id="cpu"><h2>{{ t('cpu') }}</h2><div id="cpu-value" class="metric">—</div><canvas id="cpu-chart" height="70" aria-label="{{ t('cpu') }}"></canvas><p id="load" class="fine"></p><p id="uptime"></p></section><section class="card" id="ram"><h2>{{ t('ram') }}</h2><div id="ram-value" class="metric">—</div><progress id="ram-progress" max="100" value="0"></progress><canvas id="ram-chart" height="70" aria-label="{{ t('ram') }}"></canvas><p id="ram-detail"></p></section></div><section class="card" id="disks"><h2>{{ t('disks') }}</h2><div id="physical-table" class="table-wrap"></div><div id="disk-table" class="table-wrap"></div></section><section class="card"><h2>{{ t('network') }}</h2><div id="network-table" class="table-wrap"></div></section><section class="card"><h2>{{ t('addresses') }}</h2><p>{{ t('public_address') }}: <strong>{{ public_address }}</strong></p><div id="address-table" class="table-wrap"></div></section>{% endblock %}
