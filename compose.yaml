# First installation only. Runtime services remain unprivileged.
name: server-control-first-install
services:
  setup:
    build:
      context: .
      dockerfile: Dockerfile.installer
    image: server-control-first-install:local
    command: [--detached]
    platform: linux/amd64
    privileged: true
    pid: host
    user: '0:0'
    restart: 'no'
    read_only: true
    tmpfs:
      - '/tmp:rw,noexec,nosuid,size=32m,mode=1777'
    volumes:
      - type: bind
        source: /
        target: /host
        bind: {propagation: rslave, create_host_path: false}
      - type: bind
        source: ./.installation
        target: /installation-result
    environment:
      INSTALL_SSH_CONNECTION: ${SSH_CONNECTION:-}
      SERVER_WEB_PORT: ${SERVER_WEB_PORT:-9898}
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
